<script>
/* Bricks-Logik: gespeicherte Wahl (localStorage "brx_mode") vor dem ersten Rendern anwenden,
   sonst Systemeinstellung. ?dark / ?light dienen nur der Vorschau. */
(function () {
  try {
    var m = null, q = location.search;
    if (/[?&]dark\b/.test(q)) m = 'dark'; else if (/[?&]light\b/.test(q)) m = 'light';
    if (!m) m = localStorage.getItem('brx_mode');
    if (!m && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) m = 'dark';
    document.documentElement.setAttribute('data-brx-theme', m === 'dark' ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-brx-theme', 'light'); }
})();
</script>
