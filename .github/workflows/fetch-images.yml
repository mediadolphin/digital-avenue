name: Bilder für den Prototyp holen

# Lädt die in prototype/img/sources.json gelisteten Higgsfield-Motive,
# verkleinert sie und committet sie nach prototype/img/. Hilfswerkzeug,
# weil die Claude-Code-Umgebung den Bild-CDN nicht erreicht.

on:
  workflow_dispatch:
  push:
    branches: ['claude/digital-avenue-redesign-0wnw6r']
    paths: ['prototype/img/sources.json', '.github/workflows/fetch-images.yml']

permissions:
  contents: write

concurrency:
  group: fetch-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow requests
      - name: Bilder laden und verkleinern
        run: python3 prototype/img/fetch.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/img
          if git diff --cached --quiet; then echo "Keine neuen Bilder."; exit 0; fi
          git commit -m "Prototyp-Bilder aus Higgsfield übernehmen (automatisch)"
          git push origin HEAD:${{ github.ref_name }}
