<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Light Mode Colors" subtitle="Body surfaces, text, border, hero gradient" viewport="700x240" --><html lang="de"><head><meta charset="UTF-8">
<style>
@font-face { font-family:'Manrope'; src:url('../fonts/Manrope-VariableFont_wght.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
body { font-family:'Manrope',sans-serif; margin:0; padding:16px; background:#f9f8f6; display:flex; flex-direction:column; gap:10px; }
.row { display:flex; gap:8px; }
.swatch { flex:1; border-radius:8px; overflow:hidden; }
.sc { height:56px; }
.sl { padding:6px 8px; background:#fff; border:1px solid #d9e3e8; border-top:none; border-radius:0 0 8px 8px; }
.sn { font-size:11px; font-weight:700; color:#19242b; }
.sv { font-size:10px; color:#5a6e77; }
.t { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#7796a6; margin:4px 0 2px; }
</style></head><body>
<div class="t">Surfaces</div>
<div class="row">
  <div class="swatch"><div class="sc" style="background:#f9f8f6;border:1px solid #d9e3e8"></div><div class="sl"><div class="sn">BG</div><div class="sv">#f9f8f6</div></div></div>
  <div class="swatch"><div class="sc" style="background:#f2efe9;border:1px solid #d9e3e8"></div><div class="sl"><div class="sn">BG Alt</div><div class="sv">#f2efe9</div></div></div>
  <div class="swatch"><div class="sc" style="background:#ffffff;border:1px solid #d9e3e8"></div><div class="sl"><div class="sn">Card BG</div><div class="sv">#ffffff</div></div></div>
  <div class="swatch"><div class="sc" style="background:#d9e3e8;border:1px solid #d9e3e8"></div><div class="sl"><div class="sn">Border</div><div class="sv">#d9e3e8</div></div></div>
</div>
<div class="t">Text</div>
<div class="row">
  <div class="swatch"><div class="sc" style="background:#19242b"></div><div class="sl"><div class="sn">Text</div><div class="sv">#19242b</div></div></div>
  <div class="swatch"><div class="sc" style="background:#5a6e77"></div><div class="sl"><div class="sn">Muted</div><div class="sv">#5a6e77</div></div></div>
</div>
<div class="t">Hero Gradient</div>
<div class="row">
  <div class="swatch" style="flex:3"><div class="sc" style="background:linear-gradient(160deg,#e7eff3 0%,#f9f8f6 100%)"></div><div class="sl"><div class="sn">Hero</div><div class="sv">#e7eff3 → #f9f8f6</div></div></div>
  <div class="swatch" style="flex:3"><div class="sc" style="background:linear-gradient(160deg,#f6f2ea 0%,#f9f8f6 100%)"></div><div class="sl"><div class="sn">Hero Sand Variant</div><div class="sv">#f6f2ea → #f9f8f6</div></div></div>
</div>
</body></html>
