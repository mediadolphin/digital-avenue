<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Dark Mode Colors" subtitle="Dark teal surfaces + light accent on dark" viewport="700x200" --><html lang="de"><head><meta charset="UTF-8">
<style>
@font-face { font-family:'Manrope'; src:url('../fonts/Manrope-VariableFont_wght.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
body { font-family:'Manrope',sans-serif; margin:0; padding:16px; background:#182a33; display:flex; flex-direction:column; gap:10px; }
.row { display:flex; gap:8px; }
.swatch { flex:1; border-radius:8px; overflow:hidden; }
.sc { height:56px; }
.sl { padding:6px 8px; background:#1d3340; border:1px solid #294653; border-top:none; border-radius:0 0 8px 8px; }
.sn { font-size:11px; font-weight:700; color:#ede9e0; }
.sv { font-size:10px; color:#7796a6; }
.t { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#7796a6; margin:4px 0 2px; }
</style></head><body>
<div class="t">Dark Surfaces</div>
<div class="row">
  <div class="swatch"><div class="sc" style="background:#182a33"></div><div class="sl"><div class="sn">Body BG</div><div class="sv">#182a33</div></div></div>
  <div class="swatch"><div class="sc" style="background:#1b3a4a"></div><div class="sl"><div class="sn">Nav BG</div><div class="sv">#1b3a4a</div></div></div>
  <div class="swatch"><div class="sc" style="background:#1e333e"></div><div class="sl"><div class="sn">BG Alt</div><div class="sv">#1e333e</div></div></div>
  <div class="swatch"><div class="sc" style="background:#1d3340"></div><div class="sl"><div class="sn">Card BG</div><div class="sv">#1d3340</div></div></div>
</div>
<div class="t">Dark Accent</div>
<div class="row">
  <div class="swatch"><div class="sc" style="background:#4d8aa0"></div><div class="sl"><div class="sn">Teal</div><div class="sv">#4d8aa0</div></div></div>
  <div class="swatch"><div class="sc" style="background:#5e9cb3"></div><div class="sl"><div class="sn">Teal Hover</div><div class="sv">#5e9cb3</div></div></div>
  <div class="swatch"><div class="sc" style="background:#1d3c4a"></div><div class="sl"><div class="sn">Teal Subtle</div><div class="sv">#1d3c4a</div></div></div>
  <div class="swatch"><div class="sc" style="background:#c4b393"></div><div class="sl"><div class="sn">Sand</div><div class="sv">#c4b393</div></div></div>
</div>
</body></html>
