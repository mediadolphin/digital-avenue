<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Icon Set" subtitle="Stroke icons 16px / 1.5px + favicon mark" viewport="700x320" --><html lang="de"><head><meta charset="UTF-8">
<style>
@font-face { font-family:'Manrope'; src:url('../fonts/Manrope-VariableFont_wght.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
body { font-family:'Manrope',sans-serif; margin:0; padding:20px 24px; background:#f9f8f6; display:flex; flex-direction:column; gap:16px; }
.t { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#7796a6; }
.grid { display:flex; gap:10px; flex-wrap:wrap; }
.box { width:46px; height:46px; background:#fff; border:1px solid #d9e3e8; border-radius:9px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgb(0 0 0/.04); flex-direction:column; gap:4px; }
.box-teal { background:#e7eff3; border-color:color-mix(in srgb,#305b75 25%,transparent); }
.box-dark { background:#1b3a4a; border:none; }
.lbl { font-size:9px; color:#7796a6; font-weight:600; text-align:center; margin-top:2px; }
.item { display:flex; flex-direction:column; align-items:center; }
</style></head><body>
<div class="t">Stroke Icons — 16px / 1.5px / currentColor</div>
<div class="grid">
  <div class="item"><div class="box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 10.5a6 6 0 0 1-7.5-7.5 6 6 0 1 0 7.5 7.5z" stroke="#305b75" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="lbl">moon</div></div>
  <div class="item"><div class="box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="#305b75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lbl">arrow-r</div></div>

  <div class="item"><div class="box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="9" rx="1.5" stroke="#305b75" stroke-width="1.5"/><path d="M2 7l6 4.5L14 7" stroke="#305b75" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lbl">mail</div></div>

  <div class="item"><div class="box"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2l5 2v4c0 3-2.5 5.5-5 6C5.5 13.5 3 11 3 8V4l5-2z" stroke="#305b75" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="lbl">shield</div></div>

  <div class="item"><img src="../assets/favicon.svg" alt="favicon" style="width:46px;height:46px;border-radius:10px;display:block"><div class="lbl">favicon</div></div>
  <div class="item"><img src="../assets/favicon.svg" alt="favicon" style="width:32px;height:32px;border-radius:7px;display:block"><div class="lbl">32px</div></div>

<div class="t">On teal / dark backgrounds</div>
<div class="grid">
  <div class="item"><div class="box box-teal"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="#305b75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lbl">teal bg</div></div>
  <div class="item"><div class="box box-dark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="#d7c9aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lbl">dark bg</div></div>
</div>
</body></html>
