<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Usage" subtitle="Digital Avenue wordmark — blue on light, white on dark" viewport="700x360" --><html lang="de"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap');
@font-face { font-family:'Manrope'; src:url('../fonts/Manrope-VariableFont_wght.woff2') format('woff2'); font-weight:200 800; font-display:swap; }
body { font-family:'Manrope',sans-serif; margin:0; padding:24px; background:#f9f8f6; display:flex; flex-direction:column; gap:18px; }
.t { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#7796a6; }
.row { display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.on-white { background:#fff; border:1px solid #d9e3e8; border-radius:10px; padding:22px 30px; }
.on-dark  { background:#1b3a4a; border-radius:10px; padding:22px 30px; }
.on-sand  { background:#f6f2ea; border:1px solid #d7c9aa; border-radius:10px; padding:22px 30px; }
.on-teal  { background:#305b75; border-radius:10px; padding:22px 30px; }
.logo { height:36px; display:block; }
.mark { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Jost',sans-serif; font-weight:600; font-size:18px; letter-spacing:.5px; }
</style></head><body>

<div class="t">On White (Primary)</div>
<div class="row">
  <div class="on-white"><img class="logo" src="../assets/logo-digital-avenue.svg" alt="Digital Avenue"></div>
</div>

<div class="t">On Dark — Nav / Footer (White Version)</div>
<div class="row">
  <div class="on-dark"><img class="logo" src="../assets/logo-digital-avenue-white.svg" alt="Digital Avenue"></div>
  <div class="on-teal"><img class="logo" src="../assets/logo-digital-avenue-white.svg" alt="Digital Avenue"></div>
</div>

<div class="t">On Sand / Warm BG (Blue Version)</div>
<div class="row">
  <div class="on-sand"><img class="logo" src="../assets/logo-digital-avenue.svg" alt="Digital Avenue"></div>
</div>

<div class="t">Favicon / App Mark</div>
<div class="row">
  <img src="../assets/favicon.svg" alt="Digital Avenue Favicon" style="width:64px;height:64px;border-radius:14px;display:block">
  <img src="../assets/favicon.svg" alt="Digital Avenue Favicon" style="width:40px;height:40px;border-radius:9px;display:block">
  <img src="../assets/favicon.svg" alt="Digital Avenue Favicon" style="width:24px;height:24px;border-radius:6px;display:block">
  <img src="../assets/favicon.svg" alt="Digital Avenue Favicon" style="width:16px;height:16px;border-radius:4px;display:block">
</div>

</body></html>
